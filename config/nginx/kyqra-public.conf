limit_req_zone $binary_remote_addr zone=crawler_api:10m rate=10r/s;

server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name crawler.kyqra.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/crawler.kyqra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crawler.kyqra.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location = / {
        auth_basic "Kyqra Crawler";
        auth_basic_user_file /etc/nginx/.htpasswd-kyqra;
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /readyz {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /health { return 404; }
    location = /api/v1/health { return 404; }
    location ~ ^/api/v1/jobs(?:/|$) { return 404; }
    location = /api/v1/stats { return 404; }
    location ~ ^/api/v1/webhooks(?:/|$) { return 404; }
    location / { return 404; }

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
}
server {
    listen 80;
    listen [::]:80;
    server_name crawler.kyqra.com;
    return 301 https://$host$request_uri;
}
