name: kyqra-crawler
x-app: &app
  image: '${KYQRA_IMAGE:?set an immutable image reference containing @sha256}'
  env_file: '${KYQRA_ENV_FILE:-.env}'
  environment:
    REDIS_HOST: redis
    REDIS_PASSWORD_FILE: /run/secrets/kyqra_redis_password
    DATABASE_URL: postgresql://crawler:${POSTGRES_PASSWORD}@postgres:5432/crawler
  secrets: [kyqra_redis_password]
  networks: [backend]
  restart: unless-stopped
  init: true
  user: pwuser
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=256m,uid=1001,gid=1001,mode=0700
    - /app/storage:rw,noexec,nosuid,nodev,size=512m,uid=1001,gid=1001,mode=0700
services:
  migrate:
    <<: *app
    command: ['node', 'dist/storage/postgres/migrate.js', 'up']
    restart: 'no'
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 256m
    cpus: 1
  api:
    <<: *app
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD_FILE: /run/secrets/kyqra_redis_password
      DATABASE_URL: postgresql://crawler:${POSTGRES_PASSWORD}@postgres:5432/crawler
      ROLE: api
      KYQRA_SERVICE_PRINCIPALS_FILE: /run/secrets/kyqra_service_principals
    secrets: [kyqra_service_principals, kyqra_redis_password]
    group_add: ['${KYQRA_SECRETS_GID:?set the host kyqra-secrets group id}']
    ports: ['127.0.0.1:3100:3000']
    networks: [backend, frontend]
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    mem_limit: 1g
    cpus: 2
    healthcheck:
      {
        test: ['CMD', 'curl', '-fsS', 'http://localhost:3000/health'],
        interval: 30s,
        timeout: 5s,
        retries: 3,
      }
  http-worker:
    <<: *app
    networks: [backend, frontend]
    environment:
      {
        REDIS_HOST: redis,
        REDIS_PASSWORD_FILE: /run/secrets/kyqra_redis_password,
        DATABASE_URL: 'postgresql://crawler:${POSTGRES_PASSWORD}@postgres:5432/crawler',
        ROLE: worker,
        HTTP_CONCURRENCY: 15,
        BROWSER_CONCURRENCY: 3,
        JOB_CONCURRENCY: 2,
      }
    depends_on: [api]
    mem_limit: 4g
    cpus: 6
  browser-worker:
    <<: *app
    networks: [backend, frontend]
    environment:
      {
        REDIS_HOST: redis,
        REDIS_PASSWORD_FILE: /run/secrets/kyqra_redis_password,
        DATABASE_URL: 'postgresql://crawler:${POSTGRES_PASSWORD}@postgres:5432/crawler',
        ROLE: worker,
        HTTP_CONCURRENCY: 10,
        BROWSER_CONCURRENCY: 3,
        JOB_CONCURRENCY: 1,
      }
    depends_on: [api]
    shm_size: 1gb
    mem_limit: 8g
    cpus: 6
  callback-worker:
    <<: *app
    networks: [backend, frontend]
    environment:
      {
        REDIS_HOST: redis,
        REDIS_PASSWORD_FILE: /run/secrets/kyqra_redis_password,
        DATABASE_URL: 'postgresql://crawler:${POSTGRES_PASSWORD}@postgres:5432/crawler',
        ROLE: callback,
      }
    depends_on: [api]
    mem_limit: 512m
    cpus: 1
  redis:
    image: redis:7.4-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    user: '999:1000'
    command: ['/opt/kyqra/redis-start.sh']
    secrets: [kyqra_redis_password]
    volumes:
      - redis:/data
      - ./scripts/redis-start.sh:/opt/kyqra/redis-start.sh:ro
    networks: [backend]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:rw,noexec,nosuid,nodev,size=8m,uid=999,gid=1000,mode=0700']
    mem_limit: 3g
    healthcheck:
      {
        test:
          [
            'CMD-SHELL',
            'redis-cli --no-auth-warning -a "$$(cat /run/secrets/kyqra_redis_password)" ping',
          ],
        interval: 10s,
        timeout: 3s,
        retries: 5,
      }
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      { POSTGRES_USER: crawler, POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}', POSTGRES_DB: crawler }
    volumes: ['postgres:/var/lib/postgresql/data']
    networks: [backend]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    healthcheck:
      { test: ['CMD-SHELL', 'pg_isready -U crawler'], interval: 10s, timeout: 3s, retries: 5 }
networks:
  backend: { internal: true }
  frontend: {}
volumes:
  redis:
  postgres:
secrets:
  kyqra_service_principals:
    file: '${KYQRA_SERVICE_PRINCIPALS_FILE:?set the root-owned service principal registry path}'
  kyqra_redis_password:
    file: '${KYQRA_REDIS_PASSWORD_FILE:?set the root-owned Redis password path}'
