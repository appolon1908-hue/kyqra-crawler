name: sign-kyqra-release

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: kyqra-release-signing
  cancel-in-progress: false

jobs:
  verify-and-sign:
    name: verify-and-sign-immutable-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Enforce protected release identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "appolon1908-hue/kyqra-crawler"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$(git status --porcelain)" = ""
          test "$(git rev-parse kyqra-mtls-staging-20260820^{commit})" = "a9d59681a7857795adc086d2464859674901e393"
          test "$(jq -r .repository release/kyqra-mtls-staging-20260820.json)" = "$GITHUB_REPOSITORY"
          test "$(jq -r .source_commit release/kyqra-mtls-staging-20260820.json)" = "a9d59681a7857795adc086d2464859674901e393"
          test "$(jq -r .registry_digest release/kyqra-mtls-staging-20260820.json)" = "sha256:1d918aa99ce19a7831baafdf428f3323abf8134472c2a5f202a60a84181e15e0"
          test "$(jq -r .linux_amd64_platform_digest release/kyqra-mtls-staging-20260820.json)" = "sha256:b5ad0fe7aed3d7de20e882d8f84295485b4d85c2ab54229895e46689fdf4484e"
          test "$(jq -r .release_tag release/kyqra-mtls-staging-20260820.json)" = "kyqra-mtls-staging-20260820"
          test "$(jq -r .required_workflow release/kyqra-mtls-staging-20260820.json)" = ".github/workflows/sign-kyqra-release.yml"
          test "$(sha256sum .github/workflows/sign-kyqra-release.yml | cut -d' ' -f1)" = "$(jq -r .signing_workflow_sha256 release/kyqra-mtls-staging-20260820.json)"

      - name: Verify approved evidence payloads
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc release/evidence/final-image-sbom.spdx.json.gz > "$RUNNER_TEMP/final-image-sbom.spdx.json"
          test "$(sha256sum "$RUNNER_TEMP/final-image-sbom.spdx.json" | cut -d' ' -f1)" = "$(jq -r .sbom_sha256 release/kyqra-mtls-staging-20260820.json)"
          test "$(sha256sum release/evidence/final-image-provenance.json | cut -d' ' -f1)" = "$(jq -r .provenance_sha256 release/kyqra-mtls-staging-20260820.json)"
          test "$(jq -r .buildDefinition.externalParameters.sourceCommit release/evidence/final-image-provenance.json)" = "a9d59681a7857795adc086d2464859674901e393"
          test "$(jq -r .buildDefinition.externalParameters.registryDigest release/evidence/final-image-provenance.json)" = "sha256:1d918aa99ce19a7831baafdf428f3323abf8134472c2a5f202a60a84181e15e0"

      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Sign and attest immutable digest with GitHub OIDC
        shell: bash
        env:
          IMAGE: ghcr.io/appolon1908-hue/kyqra-crawler@sha256:1d918aa99ce19a7831baafdf428f3323abf8134472c2a5f202a60a84181e15e0
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE"
          cosign attest --yes --type slsaprovenance1 --predicate release/evidence/final-image-provenance.json "$IMAGE"
          cosign attest --yes --type spdxjson --predicate "$RUNNER_TEMP/final-image-sbom.spdx.json" "$IMAGE"

      - name: Verify exact GitHub OIDC signing identity
        shell: bash
        env:
          IMAGE: ghcr.io/appolon1908-hue/kyqra-crawler@sha256:1d918aa99ce19a7831baafdf428f3323abf8134472c2a5f202a60a84181e15e0
          IDENTITY: https://github.com/appolon1908-hue/kyqra-crawler/.github/workflows/sign-kyqra-release.yml@refs/heads/main
          ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          cosign verify --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$IMAGE" > "$RUNNER_TEMP/signature-verification.json"
          cosign verify-attestation --type slsaprovenance1 --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$IMAGE" > "$RUNNER_TEMP/provenance-verification.json"
          cosign verify-attestation --type spdxjson --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$IMAGE" > "$RUNNER_TEMP/sbom-verification.json"
          jq -e 'length > 0' "$RUNNER_TEMP/signature-verification.json"
          jq -e 'length > 0' "$RUNNER_TEMP/provenance-verification.json"
          jq -e 'length > 0' "$RUNNER_TEMP/sbom-verification.json"
