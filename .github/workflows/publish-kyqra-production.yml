name: publish-kyqra-production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: kyqra-production-publisher
  cancel-in-progress: false

jobs:
  publish-protected-image:
    name: publish-protected-image
    if: github.ref == 'refs/heads/main' && github.ref_protected == true
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      IMAGE: ghcr.io/appolon1908-hue/kyqra-crawler-production
      SOURCE_SHA: ${{ github.sha }}
      TRIVY_IMAGE: aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
      SYFT_IMAGE: anchore/syft@sha256:f94e5d9fce1f2278491a8e3a63bd5f6ddb81fdfdbb8bf7a1637565c1d5344357
      GITLEAKS_IMAGE: zricethezav/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
    steps:
      - name: Check out exact protected source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify protected-main source identity
        id: source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = 'appolon1908-hue/kyqra-crawler'
          test "$IMAGE" = 'ghcr.io/appolon1908-hue/kyqra-crawler-production'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_REF_PROTECTED" = 'true'
          test "$GITHUB_EVENT_NAME" = 'push' -o "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          echo "epoch=$(git show -s --format=%ct "$SOURCE_SHA")" >> "$GITHUB_OUTPUT"

      - name: Reject committed secrets
        run: |
          docker run --rm -v "$PWD:/repo:ro" "$GITLEAKS_IMAGE" \
            git --redact --no-banner /repo

      - name: Set up pinned Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Authenticate to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build exact protected candidate
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.source.outputs.epoch }}
            SOURCE_COMMIT_SHA=${{ env.SOURCE_SHA }}
          labels: |
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: false
          sbom: false

      - name: Scan exact candidate digest before production promotion
        env:
          CANDIDATE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -Eeuo pipefail
          test "$CANDIDATE_DIGEST" != ''
          docker run --rm -v "$HOME/.docker:/root/.docker:ro" "$TRIVY_IMAGE" image \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --no-progress --format json "${IMAGE}@${CANDIDATE_DIGEST}" > vulnerability-report.json
          test "$(jq '[.Results[].Vulnerabilities[]?] | length' vulnerability-report.json)" = 0

      - name: Generate exact-digest release evidence
        env:
          CANDIDATE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -Eeuo pipefail
          exact_image="${IMAGE}@${CANDIDATE_DIGEST}"
          docker pull "$exact_image"
          docker save "$exact_image" | zstd -T0 -10 -o kyqra-image.tar.zst
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            "$SYFT_IMAGE" "docker:${exact_image}" -o spdx-json > sbom.spdx.json
          jq -e '.spdxVersion == "SPDX-2.3" and (.packages | length > 0)' sbom.spdx.json
          jq -n \
            --arg repository "https://github.com/${GITHUB_REPOSITORY}" \
            --arg source "$SOURCE_SHA" \
            --arg image "$IMAGE" \
            --arg digest "$CANDIDATE_DIGEST" \
            --arg invocation "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" \
            '{
              buildDefinition: {
                buildType: "https://codestra.co/build-types/github-protected-main/v1",
                externalParameters: {
                  repository: $repository,
                  sourceCommit: $source,
                  registryImage: $image,
                  registryDigest: $digest
                },
                internalParameters: {protectedRef: "refs/heads/main"},
                resolvedDependencies: [{
                  uri: ("git+" + $repository + "@refs/heads/main"),
                  digest: {gitCommit: $source}
                }]
              },
              runDetails: {
                builder: {id: ($repository + "/actions")},
                metadata: {invocationId: $invocation},
                byproducts: []
              }
            }' > provenance.json
          jq -e --arg source "$SOURCE_SHA" --arg digest "$CANDIDATE_DIGEST" \
            '.buildDefinition.externalParameters.sourceCommit == $source and
             .buildDefinition.externalParameters.registryDigest == $digest' provenance.json

      - name: Reject an immutable source-tag collision before signing
        id: final_tag
        env:
          CANDIDATE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -Eeuo pipefail
          final_image="${IMAGE}:sha-${SOURCE_SHA}"
          if existing="$(docker buildx imagetools inspect "$final_image" --format '{{.Manifest.Digest}}' 2>/dev/null)"; then
            test "$existing" = "$CANDIDATE_DIGEST"
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Sign and attest the passing immutable digest
        if: steps.final_tag.outputs.exists != 'true'
        env:
          CANDIDATE_DIGEST: ${{ steps.build.outputs.digest }}
          IDENTITY: https://github.com/appolon1908-hue/kyqra-crawler/.github/workflows/publish-kyqra-production.yml@refs/heads/main
          ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -Eeuo pipefail
          exact_image="${IMAGE}@${CANDIDATE_DIGEST}"
          if ! cosign verify --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" \
            "$exact_image" >/dev/null 2>&1; then
            cosign sign --yes "$exact_image"
          fi
          if ! cosign verify-attestation --type slsaprovenance1 \
            --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" \
            "$exact_image" 2>/dev/null | jq -e --arg source "$SOURCE_SHA" --arg digest "$CANDIDATE_DIGEST" '
              any(.[];
                ((.payload | @base64d | fromjson).predicate.buildDefinition.externalParameters.sourceCommit == $source) and
                ((.payload | @base64d | fromjson).predicate.buildDefinition.externalParameters.registryDigest == $digest)
              )' >/dev/null; then
            cosign attest --yes --type slsaprovenance1 --predicate provenance.json "$exact_image"
          fi
          if ! cosign verify-attestation --type spdxjson \
            --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" \
            "$exact_image" 2>/dev/null | \
            jq -e 'any(.[]; ((.payload | @base64d | fromjson).predicate.spdxVersion == "SPDX-2.3"))' >/dev/null; then
            cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$exact_image"
          fi

      - name: Verify exact GitHub OIDC signing identity and predicates
        env:
          CANDIDATE_DIGEST: ${{ steps.build.outputs.digest }}
          IDENTITY: https://github.com/appolon1908-hue/kyqra-crawler/.github/workflows/publish-kyqra-production.yml@refs/heads/main
          ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -Eeuo pipefail
          exact_image="${IMAGE}@${CANDIDATE_DIGEST}"
          cosign verify --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" \
            "$exact_image" > signature-verification.json
          cosign verify-attestation --type slsaprovenance1 \
            --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" \
            "$exact_image" > provenance-verification.json
          cosign verify-attestation --type spdxjson \
            --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" \
            "$exact_image" > sbom-verification.json
          jq -e 'length > 0' signature-verification.json
          jq -e --arg source "$SOURCE_SHA" --arg digest "$CANDIDATE_DIGEST" '
            any(.[];
              ((.payload | @base64d | fromjson).predicate.buildDefinition.externalParameters.sourceCommit == $source) and
              ((.payload | @base64d | fromjson).predicate.buildDefinition.externalParameters.registryDigest == $digest)
            )' provenance-verification.json
          jq -e 'any(.[]; ((.payload | @base64d | fromjson).predicate.spdxVersion == "SPDX-2.3"))' \
            sbom-verification.json
          echo "$SOURCE_SHA" > SOURCE_SHA
          echo "$CANDIDATE_DIGEST" > IMAGE_DIGEST
          echo "${IMAGE}:sha-${SOURCE_SHA}" > IMAGE_REF
          sha256sum SOURCE_SHA IMAGE_DIGEST IMAGE_REF provenance.json sbom.spdx.json \
            vulnerability-report.json signature-verification.json provenance-verification.json \
            sbom-verification.json kyqra-image.tar.zst > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Promote only the fully certified digest to the immutable source tag
        env:
          CANDIDATE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -Eeuo pipefail
          exact_image="${IMAGE}@${CANDIDATE_DIGEST}"
          final_image="${IMAGE}:sha-${SOURCE_SHA}"
          if existing="$(docker buildx imagetools inspect "$final_image" --format '{{.Manifest.Digest}}' 2>/dev/null)"; then
            test "$existing" = "$CANDIDATE_DIGEST"
          else
            docker buildx imagetools create --prefer-index=false --tag "$final_image" "$exact_image"
          fi
          final_digest="$(docker buildx imagetools inspect "$final_image" --format '{{.Manifest.Digest}}')"
          test "$final_digest" = "$CANDIDATE_DIGEST"

      - name: Upload checksummed release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kyqra-production-release-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            SOURCE_SHA
            IMAGE_DIGEST
            IMAGE_REF
            provenance.json
            sbom.spdx.json
            vulnerability-report.json
            signature-verification.json
            provenance-verification.json
            sbom-verification.json
            kyqra-image.tar.zst
            SHA256SUMS
